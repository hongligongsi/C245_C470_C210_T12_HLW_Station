<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="utf-8">
  <title>T12/HLW Station UI Preview 320x240</title>
  <style>
    body {
      background: #101216;
      color: #cfd3da;
      font-family: Consolas, monospace;
      margin: 24px;
    }

    h2 {
      font-size: 14px;
      font-weight: normal;
      color: #8ab4f8;
      margin: 18px 0 6px;
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 640px;
      height: 480px;
      border: 2px solid #2a2e36;
      display: block;
      background: #000;
    }

    .tag {
      color: #777;
      font-size: 12px;
      margin: 4px 0 16px;
    }
  </style>
</head>

<body>

  <h2>① 曲线风格 · 深色主题 · 加热中（C210 / 24V）</h2>
  <canvas id="cv1" width="320" height="240"></canvas>
  <div class="tag">大温度红色=加热中；黄色虚线=目标 300°C；蓝=实测温度，绿=功率%；CH2 为当前快捷温度</div>

  <h2>② 标准风格 · 深色主题 · 已就绪（保温停热）</h2>
  <canvas id="cv2" width="320" height="240"></canvas>
  <div class="tag">大温度绿色=READY；下方为功率百分比条；此页不显示曲线</div>

  <script>
    // ================= 与固件一致的调色板 (RGB565 -> CSS) =================
    function C565(hex) {
      const r = (hex >> 11) & 0x1f, g = (hex >> 5) & 0x3f, b = hex & 0x1f;
      return `rgb(${Math.round(r * 255 / 31)},${Math.round(g * 255 / 63)},${Math.round(b * 255 / 31)})`;
    }
    function C888(r, g, b) { return `rgb(${r},${g},${b})`; }
    const Pal = {
      bg: C565(0x0000), panel: C565(0x0000), fg: C565(0xFFFF),
      accent: C565(0xFFE0), ok: C565(0x07E0), warn: C565(0xFD20),
      grid: C565(0x0320), gridMin: C888(0x1C, 0x24, 0x20),
      danger: C565(0xF800), info: C565(0x07FF),
      vCol: C565(0x001F), cCol: C565(0xFFE0), pCol: C565(0xF81F),
      pill: C565(0x0320)
    };

    // ================= 5x7 点阵字库 (与 font5x7.h 同型) =================
    const F = {
      '0': [0x3E, 0x51, 0x49, 0x45, 0x3E], '1': [0x00, 0x42, 0x7F, 0x40, 0x00],
      '2': [0x42, 0x61, 0x51, 0x49, 0x46], '3': [0x21, 0x41, 0x45, 0x4B, 0x31],
      '4': [0x18, 0x14, 0x12, 0x7F, 0x10], '5': [0x27, 0x45, 0x45, 0x45, 0x39],
      '6': [0x3C, 0x4A, 0x49, 0x49, 0x30], '7': [0x01, 0x71, 0x09, 0x05, 0x03],
      '8': [0x36, 0x49, 0x49, 0x49, 0x36], '9': [0x06, 0x49, 0x49, 0x29, 0x1E],
      'A': [0x7E, 0x11, 0x11, 0x11, 0x7E], 'B': [0x7F, 0x49, 0x49, 0x49, 0x36],
      'C': [0x3E, 0x41, 0x41, 0x41, 0x22], 'D': [0x7F, 0x41, 0x41, 0x22, 0x1C],
      'E': [0x7F, 0x49, 0x49, 0x49, 0x41], 'F': [0x7F, 0x09, 0x09, 0x09, 0x01],
      'G': [0x3E, 0x41, 0x49, 0x49, 0x7A], 'H': [0x7F, 0x08, 0x08, 0x08, 0x7F],
      'I': [0x00, 0x41, 0x7F, 0x41, 0x00], 'J': [0x20, 0x40, 0x41, 0x3F, 0x01],
      'K': [0x7F, 0x08, 0x14, 0x22, 0x41], 'L': [0x7F, 0x40, 0x40, 0x40, 0x40],
      'M': [0x7F, 0x02, 0x0C, 0x02, 0x7F], 'N': [0x7F, 0x04, 0x08, 0x10, 0x7F],
      'O': [0x3E, 0x41, 0x41, 0x41, 0x3E], 'P': [0x7F, 0x09, 0x09, 0x09, 0x06],
      'Q': [0x3E, 0x41, 0x51, 0x21, 0x5E], 'R': [0x7F, 0x09, 0x19, 0x29, 0x46],
      'S': [0x46, 0x49, 0x49, 0x49, 0x31], 'T': [0x01, 0x01, 0x7F, 0x01, 0x01],
      'U': [0x3F, 0x40, 0x40, 0x40, 0x3F], 'V': [0x1F, 0x20, 0x40, 0x20, 0x1F],
      'W': [0x3F, 0x40, 0x38, 0x40, 0x3F], 'X': [0x63, 0x14, 0x08, 0x14, 0x63],
      'Y': [0x07, 0x08, 0x70, 0x08, 0x07], 'Z': [0x61, 0x51, 0x49, 0x45, 0x43],
      ' ': [0, 0, 0, 0, 0], '.': [0, 0x60, 0x60, 0, 0], ',': [0, 0x80, 0x60, 0, 0],
      '-': [0x08, 0x08, 0x08, 0x08, 0x08], '=': [0x14, 0x14, 0x14, 0x14, 0x14],
      ':': [0, 0x36, 0x36, 0, 0], '!': [0, 0, 0x7F, 0], '?': [0x02, 0x01, 0x51, 0x09, 0x06],
      '/': [0x20, 0x10, 0x08, 0x04, 0x02], '%': [0x23, 0x13, 0x08, 0x64, 0x62],
      '(': [0, 0x1C, 0x22, 0x41, 0], ')': [0, 0x41, 0x22, 0x1C, 0],
      '+': [0x08, 0x08, 0x3E, 0x08, 0x08], '"': [0x02, 0x03, 0, 0x02, 0x03]
    };

    // 8x8 顶栏图标 (与 ui.cpp 位图一致)
    const ICON_HOURGLASS = [0xFF, 0x7E, 0x3C, 0x18, 0x18, 0x3C, 0x7E, 0xFF];
    const ICON_SPEAKER = [0x18, 0x3C, 0x7E, 0xE0, 0xE0, 0x7E, 0x3C, 0x18];

    // ================= 绘图原语 (镜像 tft.cpp) =================
    function makeCtx(canvas) {
      const g = canvas.getContext('2d');
      function px(x, y, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, 1, 1); }
      function fillRect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
      function drawRect(x, y, w, h, c) {
        g.fillStyle = c;
        g.fillRect(x, y, w, 1); g.fillRect(x, y + h - 1, w, 1);
        g.fillRect(x, y, 1, h); g.fillRect(x + w - 1, y, 1, h);
      }
      function hline(x, y, w, c) { g.fillStyle = c; g.fillRect(x, y, w, 1); }
      function vline(x, y, h, c) { g.fillStyle = c; g.fillRect(x, y, 1, h); }
      function line(x0, y0, x1, y1, c) { // Bresenham
        let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
        let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx - dy;
        for (; ;) {
          px(x0, y0, c);
          if (x0 === x1 && y0 === y1) break;
          let e2 = 2 * err;
          if (e2 > -dy) { err -= dy; x0 += sx; }
          if (e2 < dx) { err += dx; y0 += sy; }
        }
      }
      function ch(c) { return F[c] || F[' ']; }
      function text(x, y, s, fg, bg, scl) { // 与 drawText 一致: 6*scl 步进, 不透明底
        scl = scl || 1;
        for (let i = 0; i < s.length; i++) {
          const g5 = ch(s[i]); const ox = x + i * 6 * scl;
          fillRect(ox, y, 6 * scl, 7 * scl, bg);
          for (let c = 0; c < 5; c++) for (let r = 0; r < 7; r++)
            if (g5[c] & (1 << r)) fillRect(ox + c * scl, y + r * scl, scl, scl, fg);
        }
      }
      function tw(s, scl) { return s.length * 6 * (scl || 1); }
      function icon(x, y, bmp, c) {
        for (let r = 0; r < 8; r++) for (let cc = 0; cc < 8; cc++)
          if (bmp[r] & (0x80 >> cc)) px(x + cc, y + r, c);
      }
      function degC(x, y, fg, bg, scl) { // °C: ° 用与固件 FONT_DEG 完全一致的 4x4 圆环
        scl = scl || 1;
        fillRect(x, y, 5 * scl, 7 * scl, bg);
        const ring = [[1, 0], [2, 0], [0, 1], [3, 1], [0, 2], [3, 2], [1, 3], [2, 3]];
        for (const [cx, cy] of ring) fillRect(x + cx * scl, y + cy * scl, scl, scl, fg);
        text(x + 6 * scl, y, "C", fg, bg, scl);
      }
      function clear(c) { fillRect(0, 0, 320, 240, c); }
      return { g, px, fillRect, drawRect, hline, vline, line, text, tw, icon, degC, clear };
    }

    // ================= 布局宏 (与 ui.cpp 完全一致) =================
    const W = {
      HDR_H: 18, VIP_LBL_Y: 21, VIP_VAL_Y: 30, VIP_X0: 8, VIP_X1: 118, VIP_X2: 230,
      CH_Y: 50, CH_VAL_Y: 60, CH_X0: 6, CH_DX: 60, BIG_X: 192, BIG_Y: 50, BIG_SCALE: 7,
      SET_Y: 104, CUR_X0: 26, CUR_X1: 294, CUR_Y0: 120, CUR_Y1: 220, TMAX: 480
    };
    const HIST_N = 64;

    // 生成一段"加热到 300C"的典型历史曲线(最旧->最新)
    function genHistory(set) {
      const pw = [], tp = [];
      for (let k = 0; k < HIST_N; k++) {
        let t = set - (set - 25) * Math.exp(-k / 11) + 10 * (k / 18) * Math.exp(-Math.max(0, k - 18) / 14)
          + (k > 40 ? Math.sin(k / 2) * 0.8 : 0);
        tp.push(Math.max(20, Math.round(t)));
        let p;
        if (t < set - 15) p = 100;
        else p = Math.max(0, Math.min(100, Math.round(20 + (set - t) * 2 + (Math.random() * 6 - 3))));
        pw.push(p);
      }
      // 最新几拍: 温度到达, 占空比降到 ~35-45% 保温
      for (let k = HIST_N - 6; k < HIST_N; k++) { pw[k] = 38 + ((k * 7) % 9); tp[k] = set - 1 + ((k * 3) % 3) - 1; }
      return { pw, tp };
    }

    function drawScreen(g, st) {
      const { curve, heating, vbus, cur, pwr, set, big, quick, qIdx, footer } = st;
      g.clear(Pal.bg);

      // ---- 顶栏(与背景同色) ----
      g.fillRect(0, 0, 320, W.HDR_H, Pal.panel);
      g.text(4, 2, "C210", Pal.fg, Pal.panel, 2);
      // 喇叭(声音开): 图标 + 声波
      g.icon(290, 5, ICON_SPEAKER, Pal.fg);
      g.text(299, 5, "))", Pal.fg, Pal.panel, 1);

      // ---- V/I/P 标签 + 列分隔线 ----
      g.text(W.VIP_X0, W.VIP_LBL_Y, "VOLTAGE", Pal.grid, Pal.bg, 1);
      g.text(W.VIP_X1, W.VIP_LBL_Y, "CURRENT", Pal.grid, Pal.bg, 1);
      g.text(W.VIP_X2, W.VIP_LBL_Y, "POWER", Pal.grid, Pal.bg, 1);
      g.vline(W.VIP_X1 - 8, W.VIP_LBL_Y - 2, 25, Pal.gridMin);
      g.vline(W.VIP_X2 - 8, W.VIP_LBL_Y - 2, 25, Pal.gridMin);
      // 数值 2x
      g.text(W.VIP_X0, W.VIP_VAL_Y, vbus.toFixed(1) + "V", Pal.vCol, Pal.bg, 2);
      g.text(W.VIP_X1, W.VIP_VAL_Y, cur.toFixed(2) + "A", Pal.cCol, Pal.bg, 2);
      g.text(W.VIP_X2, W.VIP_VAL_Y, pwr.toFixed(1) + "W", Pal.pCol, Pal.bg, 2);

      // ---- CH1/2/3 ----
      for (let i = 0; i < 3; i++) {
        const x = W.CH_X0 + i * W.CH_DX, act = (i === qIdx);
        const col = act ? Pal.ok : Pal.grid, bg = Pal.bg;
        g.text(x + 2, W.CH_Y, "CH" + (i + 1), col, bg, 1);
        g.text(x + 2, W.CH_VAL_Y, String(quick[i]), col, bg, 2);
      }

      // ---- 大温度 ----
      g.fillRect(W.BIG_X - 2, W.BIG_Y - 2, 128, 7 * W.BIG_SCALE + 4, Pal.bg);
      g.text(W.BIG_X, W.BIG_Y, String(big).padStart(3), heating ? Pal.danger : Pal.ok, Pal.bg, W.BIG_SCALE);

      // ---- SET 行 ----
      g.fillRect(W.BIG_X - 2, W.SET_Y - 2, 128, 18, Pal.bg);
      let sx = W.BIG_X;
      g.text(sx, W.SET_Y, "SET", Pal.accent, Pal.bg, 2);
      sx += g.tw("SET ", 2);
      g.text(sx, W.SET_Y, String(set), Pal.ok, Pal.bg, 2);
      sx += g.tw(String(set), 2);
      g.degC(sx + 2, W.SET_Y + 6, Pal.ok, Pal.bg, 1);

      // ---- 下沿分隔线 ----
      g.hline(0, W.CUR_Y1 + 3, 320, Pal.grid);

      if (curve) {
        const gx = W.CUR_X0, gw = W.CUR_X1 - W.CUR_X0 + 1, gy = W.CUR_Y0, gh = W.CUR_Y1 - W.CUR_Y0 + 1, yb = W.CUR_Y1;
        g.fillRect(gx, gy, gw, gh, Pal.bg);
        // 横网格 + 双轴刻度
        for (let i = 0; i < 5; i++) {
          const y = yb - Math.round((gh - 1) * i / 4);
          if (i > 0 && i < 4) g.hline(gx, y, gw, Pal.grid);
          let lb = String(W.TMAX * i / 4 | 0);
          g.text(gx - 6 - g.tw(lb, 1), y - 3, lb, Pal.fg, Pal.bg, 1);
          lb = String(25 * i);
          g.text(W.CUR_X1 + 5, y - 3, lb, Pal.fg, Pal.bg, 1);
          g.hline(gx - 3, y, 3, Pal.danger);
          g.hline(W.CUR_X1 + 1, y, 3, Pal.danger);
        }
        // 竖网格
        for (let i = 1; i < 8; i++) { const x = gx + Math.round((gw - 1) * i / 8); g.vline(x, gy, gh, Pal.gridMin); }
        // 设定温度虚线
        if (heating) {
          const sy = yb - Math.round(set * (gh - 1) / W.TMAX);
          for (let x = gx; x < gx + gw - 5; x += 7) g.hline(x, sy, 4, Pal.accent);
        }
        // 历史曲线
        const H = genHistory(set);
        let pp = null, pt = null;
        for (let k = 0; k < HIST_N; k++) {
          const x = gx + Math.round(k * (gw - 1) / (HIST_N - 1));
          const py = yb - Math.round(H.pw[k] * (gh - 1) / 100);
          const tv = Math.min(H.tp[k], W.TMAX);
          const ty = yb - Math.round(tv * (gh - 1) / W.TMAX);
          if (pp) { g.line(pp[0], pp[1], x, py, Pal.ok); g.line(pt[0], pt[1], x, ty, Pal.vCol); }
          pp = [x, py]; pt = [x, ty];
        }
      } else {
        // 标准风格功率条
        const gx = W.CUR_X0, gw = W.CUR_X1 - W.CUR_X0 + 1, gy = W.CUR_Y0, gh = W.CUR_Y1 - W.CUR_Y0 + 1;
        g.drawRect(gx, gy, gw, gh, Pal.grid);
        const dp = 0; // 就绪停热
        const fillW = Math.round((gw - 4) * dp / 100);
        if (fillW > 0) g.fillRect(gx + 2, gy + 2, fillW, gh - 4, dp > 70 ? Pal.danger : (dp > 40 ? Pal.warn : Pal.ok));
        const msg = "PWR " + dp + "%";
        g.text(gx + (gw - g.tw(msg, 4)) / 2, gy + gh / 2 - 14, msg, Pal.fg, Pal.bg, 4);
      }

      // ---- footer ----
      g.hline(0, 229, 320, Pal.grid);
      g.text((320 - g.tw(footer, 1)) / 2, 231, footer, Pal.grid, Pal.bg, 1);
    }

    drawScreen(makeCtx(document.getElementById('cv1')), {
      curve: true, heating: true, vbus: 23.9, cur: 1.85, pwr: 44.2, set: 300, big: 286,
      quick: [320, 300, 350], qIdx: 1, footer: "CLICK=TMP"
    });
    drawScreen(makeCtx(document.getElementById('cv2')), {
      curve: false, heating: false, vbus: 23.9, cur: 0.00, pwr: 0.0, set: 300, big: 300,
      quick: [320, 300, 350], qIdx: 1, footer: "HOLD=MENU"
    });
  </script>
</body>

</html>
