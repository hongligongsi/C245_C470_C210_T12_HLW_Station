; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
;   https://docs.platformio.org/page/projectconf.html
;
; 三个固件环境(业务代码/界面/PID/保护完全一致, 只有输入方式与开机行为不同):
;   hc32f460jeta        EC11 旋转编码器版(默认)
;   hc32f460jeta-btn    三按键版(加/减/确认)
;   hc32f460jeta-auto   开机即用版(无任何输入, 靠手柄拔插操作, 见 src/nokey.cpp)

[platformio]
default_envs = hc32f460jeta

; 三个环境共用的编译参数
[shared]
base_flags =
	-DCORE_ADC_RESOLUTION=12
	-DUSE_OTS
	-DLCD_TYPE=3
	-DLCD_SPI_TICKS=1

; ---------------------------------------------------------------------------
; 可选编译宏(不写就用代码里的默认值; 需要时追加到对应 env 的 build_flags 行尾)
;
;   出货定制   -DCFG_BOOT_TEMP=320        出厂开机温度(仅 Flash 无有效配置时生效)
;              -DCFG_SLEEP_MIN=3          出厂休眠分钟数
;   算法回退   -DTC_LINEAR_UV_PER_C=41    用固定 41uV/°C 线性换算(默认走 NIST K 分度表)
;   硬件适配   -DENC_INVERTED             编码器旋转方向反了(计数反相)
;              -DBTN_UP_PIN=PA1 -DBTN_DOWN_PIN=PA0 -DBTN_OK_PIN=PA2   三键换脚位
;              -DPIN_VIBRATION=PAx        有滚珠/振动开关时启用(默认不启用)
;              -DPIN_ALARM=PAx            有外部报警输出时启用(默认不启用)
;   屏幕适配   -DLCD_TYPE=n / -DLCD_X_OFFSET=.. / -DLCD_Y_OFFSET=..
;              -DLCD_CTRL_ST7735 -DLCD_MADCTL=.. -DLCD_LANDSCAPE
; ---------------------------------------------------------------------------

[env:hc32f460jeta]
platform = https://github.com/shadow578/platform-hc32f46x.git
framework = arduino
board = hc32f460jeta
upload_protocol = custom
upload_command = pyocd load --target hc32f460xe -O connect_mode=under-reset $SOURCE
build_flags = ${shared.base_flags}
monitor_speed = 115200
debug_init_break = tbreak setup

; 按键版固件: 三键(加/减/确认)替代 EC11 编码器, 其余功能完全相同
; 默认脚位与编码器同座(A=加, B=减, C=确认), 可用 -DBTN_UP_PIN= 等覆盖
[env:hc32f460jeta-btn]
extends = env:hc32f460jeta
build_flags = ${shared.base_flags} -DINPUT_BUTTONS

; 开机即用版: 上电自动加热到「开机温度」, 不占用按键/EC11 引脚(PA0/PA1/PA2)
; 无输入时的操作: 断电->拔手柄->上电, 8 秒冷机窗口内"快插快拔"进无键设置
; (航空头严禁带电插拔, 头温 >60°C 时固件不认任何拔插手势)
[env:hc32f460jeta-auto]
extends = env:hc32f460jeta
build_flags = ${shared.base_flags} -DBOOT_POWER_ON -DNO_INPUT
