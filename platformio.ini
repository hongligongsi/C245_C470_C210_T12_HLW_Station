; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = hc32f460jeta

; 两个环境共用的编译参数
[shared]
base_flags =
	-DCORE_ADC_RESOLUTION=12
	-DUSE_OTS
	-DLCD_TYPE=3
	-DLCD_SPI_TICKS=1

[env:hc32f460jeta]
platform = https://github.com/shadow578/platform-hc32f46x.git
framework = arduino
board = hc32f460jeta
upload_protocol = custom
upload_command = pyocd load --target hc32f460xe -O connect_mode=under-reset $SOURCE
build_flags = ${shared.base_flags}
monitor_speed = 115200
debug_init_break = tbreak setup

; 按键版固件: 三键(加/减/确认)替代 EC11 编码器, 其余功能完全相同
[env:hc32f460jeta-btn]
extends = env:hc32f460jeta
build_flags = ${shared.base_flags} -DINPUT_BUTTONS
